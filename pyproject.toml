[project]
name = "starwars-autocalls"
version = "0.1.0"
description = "Prueba técnica para Habla Computing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "joblib>=1.4.2",
    "mlflow>=2.16.0",
    "numpy>=1.26.4",
    "optuna>=4.0.0",
    "pandas>=2.2.2",
    "pandera>=0.20.4",
    "plotly>=5.24.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "rich>=13.7.0",
    "scikit-learn>=1.5.1",
    "structlog>=24.4.0",
    "typer>=0.12.5",
    "uvicorn>=0.30.6",
]

[project.optional-dependencies]
boosting = [
    "catboost>=1.2.5",
    "lightgbm>=4.5.0",
    "xgboost>=2.1.1",
]
eda = [
    "skimpy>=0.0.15",
    "skrub>=0.3.1",
    "sweetviz>=2.3.1",
]
explain = [
    "matplotlib>=3.9.0",
]
dev = [
    "httpx>=0.27.2",
    "mkdocs-material>=9.5.0",
    "pre-commit>=3.8.0",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.2",
]
demo = [
    "streamlit>=1.38.0",
]

[project.scripts]
starwars-autocalls = "starwars_autocalls.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starwars_autocalls"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=starwars_autocalls --cov-report=term-missing"
